name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Check version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure musl C compilation
        if: runner.os == 'Linux'
        run: echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo test --locked --target "$TARGET"
      - run: python3 tests/pty_smoke.py "target/$TARGET/debug/mdmore"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          mkdir package
          cp "target/$TARGET/release/mdmore" LICENSE README.md package/
          tar -czf "mdmore-$GITHUB_REF_NAME-$TARGET.tar.gz" -C package mdmore LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          path: mdmore-*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mdmore-*
          merge-multiple: true
      - run: sha256sum mdmore-*.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" mdmore-*.tar.gz SHA256SUMS \
            --verify-tag --title "mdmore $GITHUB_REF_NAME" \
            --notes "Markdown pager with progressive rendering. Binaries for macOS and Linux, on ARM64 and x86-64."
